<script>
// === FIREBASE CONFIGURATION ===
const firebaseConfig = {
  apiKey: "AIzaSyDzH6qScJS7tkKQr5ayR1VpD0armVmX9BI",
  authDomain: "timer-1d700.firebaseapp.com",
  databaseURL: "https://timer-1d700-default-rtdb.europe-west1.firebasedatabase.app",

let db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
} catch(e) { console.error("Firebase init error:", e); }

// === STATE ===
let levelIndex = 0, timeLeft = 10 * 60, timerInterval = null;
let isRunning = false, isPaused = false, audioCtx = null, wakeLock = null;
let warn60 = false, warn30 = false, warn3 = false;
let players = [], dealerIndex = 0;
let deleteConfirmId = null; 

// Переменные для точной синхронизации
let syncTargetTime = 0; // Время окончания уровня в миллисекундах
let syncIsCountingDown = false;

let gestureSettings = { holdTime: 1000, cooldown: 3000 };
let gestureState = { active: false, holding: 0, lastTrigger: 0, mpReady: false, stream: null, running: false };

const $ = id => document.getElementById(id);

function loadGestureSettings() {
  const s = localStorage.getItem('gestureSettings_v2');
  if(s) Object.assign(gestureSettings, JSON.parse(s));
}
function saveGestureSettings() {
  localStorage.setItem('gestureSettings_v2', JSON.stringify(gestureSettings));
}

const fixedStructure = [
  { sb: 1, bb: 2 }, { sb: 2, bb: 4 }, { sb: 3, bb: 6 }, { sb: 4, bb: 8 }, { sb: 5, bb: 10 },
  { sb: 10, bb: 20 }, { sb: 15, bb: 30 }, { sb: 20, bb: 40 }, { sb: 25, bb: 50 },
  { sb: 30, bb: 60 }, { sb: 40, bb: 80 }, { sb: 50, bb: 100 }, { sb: 60, bb: 120 },
  { sb: 80, bb: 160 }, { sb: 100, bb: 200 }, { sb: 150, bb: 300 }, { sb: 200, bb: 400 },
  { sb: 300, bb: 600 }, { sb: 400, bb: 800 }, { sb: 500, bb: 1000 }
];
let structure = [...fixedStructure];

function getActiveIndices() { return players.map((p, i) => p.active ? i : -1).filter(i => i !== -1); }
function getPositions() {
  const active = getActiveIndices();
  if (active.length < 2) return { dealer: -1, sb: -1, bb: -1 };
  let pos = active.indexOf(dealerIndex);
  if (pos === -1) pos = 0;
  const n = active.length;
  return { dealer: active[pos], sb: active[(pos + 1) % n], bb: active[(pos + 2) % n] };
}

function changeDealer(silent = false) {
  const active = getActiveIndices();
  if (active.length < 2) return;
  const currentPos = active.indexOf(dealerIndex);
  const nextPos = (currentPos === -1 ? 0 : currentPos + 1) % active.length;
  dealerIndex = active[nextPos];
  renderPlayers(); renderAmbientTable();
  if (!silent) { playDealerSound(); requestAnimationFrame(() => { const pos = getPositions(); dealChips(pos.sb, pos.bb); }); }
  syncState();
}

let hands = null, videoLoopId = null;

function showGestureError(msg) { $('gestureStatus').textContent = msg; $('gestureStatus').classList.add('active'); $('gestureOverlay').classList.remove('active'); }

function initMediaPipe() {
  if(typeof Hands === 'undefined') { showGestureError('❌ Библиотека AI не загрузилась.'); return false; }
  $('gestureStatus').textContent = '⏳ Загрузка модели...';
  hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
  hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
  
  hands.onResults(results => {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      const lm = results.multiHandLandmarks[0];
      const thumbOpen = Math.abs(lm[4].x - lm[0].x) > Math.abs(lm[2].x - lm[0].x);
      const indexOpen = lm[8].y < lm[6].y;
      const middleOpen = lm[12].y < lm[10].y;
      const ringClosed = lm[16].y > lm[14].y;
      const pinkyClosed = lm[20].y > lm[18].y;
      const isThreeFingers = thumbOpen && indexOpen && middleOpen && ringClosed && pinkyClosed;
      
      if (isThreeFingers) {
        gestureState.holding += 100;
        $('gestureOverlay').classList.add('detected');
        $('gestureStatus').textContent = `👌 3 пальца... ${(gestureState.holding/1000).toFixed(1)}s`;
        if (gestureState.holding >= gestureSettings.holdTime && (Date.now() - gestureState.lastTrigger >= gestureSettings.cooldown)) triggerGestureDealer();
      } else {
        gestureState.holding = Math.max(0, gestureState.holding - 300);
        $('gestureOverlay').classList.remove('detected');
        $('gestureStatus').textContent = gestureState.holding > 200 ? '👌 Почти...' : '👌 Покажите 3 пальца';
      }
    } else {
      gestureState.holding = Math.max(0, gestureState.holding - 300);
      $('gestureOverlay').classList.remove('detected');
      $('gestureStatus').textContent = '👌 Покажите 3 пальца';
    }
  });
  gestureState.mpReady = true;
  return true;
}

async function startCamera() {
  $('gestureStatus').textContent = '⏳ Запуск камеры...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } });
    const video = $('camVideo');
    video.srcObject = stream; video.setAttribute('playsinline', true); video.muted = true;
    await new Promise((resolve, reject) => {
      video.onloadedmetadata = () => resolve();
      video.onerror = () => reject(new Error('Не удалось загрузить видео'));
      setTimeout(() => reject(new Error('Тайм-аут подключения к камере')), 5000);
    });
    await video.play();
    gestureState.stream = stream; gestureState.running = true; gestureState.holding = 0;
    $('gestureStatus').textContent = '✅ Камера активна';
    const sendFrame = async () => {
      if (!gestureState.running || !hands || video.readyState < 2) { if(gestureState.running) videoLoopId = requestAnimationFrame(sendFrame); return; }
      try { await hands.send({image: video}); } catch(e) {}
      videoLoopId = requestAnimationFrame(sendFrame);
    };
    videoLoopId = requestAnimationFrame(sendFrame);
    return true;
  } catch(err) {
    console.error('Camera error:', err);
    gestureState.running = false;
    showGestureError(`❌ ${err.message}`);
    return false;
  }
}

function stopCamera() {
  gestureState.running = false;
  if (videoLoopId) cancelAnimationFrame(videoLoopId);
  if (gestureState.stream) { gestureState.stream.getTracks().forEach(t => t.stop()); gestureState.stream = null; }
  $('camVideo').srcObject = null;
}

function triggerGestureDealer() {
  gestureState.lastTrigger = Date.now(); gestureState.holding = 0;
  changeDealer(true);
  const pos = getPositions();
  playDealerSound(); dealChips(pos.sb, pos.bb);
  const nextName = players[pos.dealer]?.name || `P${pos.dealer+1}`;
  $('gestureStatus').textContent = `✅ Дилер → ${nextName}`;
  $('gestureOverlay').classList.remove('detected');
}

function toggleCamera() {
  if (!window.isSecureContext && location.hostname !== 'localhost') { showGestureError('🔒 Требуется HTTPS!'); return; }
  if (!gestureState.mpReady) { if(!initMediaPipe()) return; }
  if (!gestureState.running) {
    $('ambCamBtn').classList.add('active'); $('gestureOverlay').classList.add('active'); $('gestureStatus').classList.add('active');
    startCamera();
  } else {
    stopCamera(); $('ambCamBtn').classList.remove('active'); $('gestureOverlay').classList.remove('active'); $('gestureStatus').classList.remove('active');
  }
}
$('ambCamBtn').onclick = toggleCamera;

function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
function playDealerSound() { try { initAudio(); const now = audioCtx.currentTime; [880, 1100].forEach((freq, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'sine'; o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination); const t = now + i * 0.08; o.start(t); o.stop(t + 0.1); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.01, t + 0.1); }); if(navigator.vibrate) navigator.vibrate(30); } catch(e){} }
function playLevelUpSound() { try { initAudio(); const now = audioCtx.currentTime; const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(440, now); o.frequency.linearRampToValueAtTime(880, now + 0.3); o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now + 0.3); g.gain.setValueAtTime(0.5, now); g.gain.linearRampToValueAtTime(0, now + 0.3); if(navigator.vibrate) navigator.vibrate([100, 50, 100]); } catch(e){} }
function playWarning() { try { initAudio(); const now = audioCtx.currentTime; const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'square'; o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now + 0.1); g.gain.setValueAtTime(0.2, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.1); if(navigator.vibrate) navigator.vibrate(50); } catch(e){} }
function playUrgentWarning() {
  try { initAudio(); const now = audioCtx.currentTime;
    [880, 1100, 880, 1100].forEach((freq, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'square'; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      const t = now + i * 0.12; o.start(t); o.stop(t + 0.08);
      g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
    });
    if(navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 100]);
  } catch(e){}
}
async function requestWakeLock() { try { if('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', ()=>wakeLock=null); } } catch(e){} }
function releaseWakeLock() { if(wakeLock) { wakeLock.release(); wakeLock=null; } }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && isRunning) requestWakeLock(); });

function generateStructure() { const type = $('progression').value; if (type === 'custom') { structure = [...fixedStructure]; return; } structure = [{ sb: 1, bb: 2 }]; for (let i = 1; i < 20; i++) { let prev = structure[i-1]; if (type === 'double') structure.push({ sb: prev.bb, bb: prev.bb * 2 }); else { const nextBb = Math.ceil(prev.bb * 1.5); structure.push({ sb: Math.ceil(nextBb*0.5), bb: nextBb }); } } }
function formatTime(sec) { const m = Math.floor(sec/60).toString().padStart(2,'0'); const s = (sec%60).toString().padStart(2,'0'); return `${m}:${s}`; }

function togglePlayerStatus(index) {
  const wasActive = players[index].active; const posBefore = getPositions(); players[index].active = !players[index].active;
  if (wasActive && !players[index].active && (index === posBefore.dealer || index === posBefore.sb || index === posBefore.bb)) changeDealer(true);
  renderPlayers(); renderAmbientTable(); saveSettings(); syncState();
}
function initiateDelete(index) { if (deleteConfirmId === index) { players.splice(index, 1); if (players.length === 0) dealerIndex = 0; else if (dealerIndex >= players.length) dealerIndex = 0; deleteConfirmId = null; renderPlayers(); saveSettings(); syncState(); } else { deleteConfirmId = index; renderPlayers(); } }
function cancelDelete() { deleteConfirmId = null; renderPlayers(); }
function reviveAll() { players.forEach(p => p.active = true); renderPlayers(); saveSettings(); syncState(); }
$('reviveAllBtn').onclick = reviveAll;

function renderPlayers() { const list = $('playersList'); const pos = getPositions(); const activeCount = getActiveIndices().length; $('playerCount').textContent = `${activeCount} / ${players.length}`; list.innerHTML = ''; if (players.length === 0) { list.innerHTML = '<div style="opacity:0.5; text-align:center; padding:15px; width:100%;">Нет игроков</div>'; return; } players.forEach((p, i) => { const item = document.createElement('div'); item.className = 'player-item'; if (!p.active) item.classList.add('out'); if (i === pos.dealer && p.active) item.classList.add('dealer'); if (i === pos.sb && p.active) item.classList.add('sb'); if (i === pos.bb && p.active) item.classList.add('bb'); let badges = ''; if (i === pos.dealer && p.active) badges += '<span class="player-badge badge-dealer">D</span>'; if (i === pos.sb && p.active) badges += '<span class="player-badge badge-sb">SB</span>'; if (i === pos.bb && p.active) badges += '<span class="player-badge badge-bb">BB</span>'; if (!p.active) badges += '<span class="player-badge" style="background:#555; color:#aaa;">OUT</span>'; const statusBtn = document.createElement('button'); statusBtn.className = `btn-status ${p.active ? 'active' : 'out'}`; statusBtn.textContent = p.active ? '😎' : '😴'; statusBtn.onclick = (e) => { e.stopPropagation(); togglePlayerStatus(i); }; item.innerHTML = `<div class="player-name">${p.name || `P${i+1}`}</div>${badges}`; item.prepend(statusBtn); if (players.length > 1) { const btn = document.createElement('button'); btn.className = 'btn-remove'; if (deleteConfirmId === i) { btn.classList.add('confirm-mode'); btn.textContent = '?'; } else { btn.textContent = '✕'; } btn.onclick = (e) => { e.stopPropagation(); initiateDelete(i); }; item.appendChild(btn); } item.onclick = () => { if(deleteConfirmId !== null) cancelDelete(); }; list.appendChild(item); }); }

function addPlayer(name) { const trimmed = (name || '').trim(); if (!trimmed) return; players.push({ name: trimmed, id: Date.now(), active: true }); if (players.length === 1) dealerIndex = 0; deleteConfirmId = null; renderPlayers(); saveSettings(); syncState(); $('playerName').value = ''; $('playerName').focus(); }
$('addPlayerBtn').onclick = () => addPlayer($('playerName').value);
$('playerName').onkeypress = (e) => { if(e.key==='Enter') addPlayer($('playerName').value); };

$('closeCheatBtn').onclick = () => $('cheatOverlay').classList.remove('active');
$('nextDealerBtn').onclick = () => changeDealer(false);

function dealChips(sbIdx, bbIdx) { if (!document.body.classList.contains('ambient')) return; const table = $('ambientTable'); const cx = window.innerWidth / 2; const cy = window.innerHeight / 2; [sbIdx, bbIdx].forEach(idx => { const node = table.querySelector(`.player-node[data-i="${idx}"]`); if (!node) return; const nodeRect = node.getBoundingClientRect(); const targetX = nodeRect.left + nodeRect.width/2; const targetY = nodeRect.top + nodeRect.height/2; const chip = document.createElement('div'); chip.className = 'flying-chip'; chip.style.left = `${cx}px`; chip.style.top = `${cy}px`; table.appendChild(chip); const anim = chip.animate([ { transform: 'translate(-50%, -50%) scale(0.5)', opacity: 0 }, { transform: 'translate(-50%, -50%) scale(1)', opacity: 1, offset: 0.2 }, { transform: `translate(calc(-50% + ${targetX - cx}px), calc(-50% + ${targetY - cy}px)) scale(1)`, opacity: 1, offset: 0.7 }, { transform: `translate(calc(-50% + ${targetX - cx}px), calc(-50% + ${targetY - cy}px)) scale(0.5)`, opacity: 0 } ], { duration: 700, easing: 'ease-in-out' }); anim.onfinish = () => chip.remove(); }); }

function renderAmbientTable() { 
  const table = $('ambientTable'); Array.from(table.querySelectorAll('.player-node')).forEach(el => el.remove()); 
  if (players.length < 1) return; 
  const pos = getPositions(); const count = players.length; 
  const isMobile = window.innerWidth <= 540;
  const radiusX = isMobile ? 40 : 40; const radiusY = isMobile ? 32 : 30; 
  players.forEach((p, i) => { 
    const angleDeg = (360 / count) * i - 90; const angleRad = angleDeg * Math.PI / 180;
    const x = 50 + radiusX * Math.cos(angleRad); const y = 50 + radiusY * Math.sin(angleRad);
    const node = document.createElement('div'); node.className = 'player-node'; node.dataset.i = i;
    if (!p.active) node.classList.add('out');
    if (i === pos.dealer && p.active) node.classList.add('dealer');
    if (i === pos.sb && p.active) node.classList.add('sb');
    if (i === pos.bb && p.active) node.classList.add('bb');
    let badgeHtml = '';
    if (!p.active) badgeHtml = `<div class="p-badge out">OUT</div>`;
    else if (i === pos.dealer) badgeHtml = `<div class="p-badge d">D</div>`;
    else if (i === pos.sb) badgeHtml = `<div class="p-badge s">SB</div>`;
    else if (i === pos.bb) badgeHtml = `<div class="p-badge b">BB</div>`;
    const name = p.name || `P${i+1}`;
    const toggleBtn = document.createElement('div'); toggleBtn.className = `amb-toggle-btn ${!p.active ? 'is-out' : ''}`;
    toggleBtn.innerHTML = !p.active ? '😴' : '😎';
    toggleBtn.onclick = (e) => { e.stopPropagation(); togglePlayerStatus(i); };
    node.innerHTML = `<div class="p-name">${name}</div>${badgeHtml}`; node.appendChild(toggleBtn); 
    node.onclick = (e) => { if (e.target === toggleBtn || toggleBtn.contains(e.target)) return; if (p.active && dealerIndex !== i) { dealerIndex = i; renderPlayers(); renderAmbientTable(); playDealerSound(); requestAnimationFrame(() => dealChips(getPositions().sb, getPositions().bb)); } };
    node.style.left = `${x}%`; node.style.top = `${y}%`; table.appendChild(node); 
  }); 
  $('ambDealerBtn').style.display = 'flex'; $('ambCamBtn').style.display = 'flex'; $('ambCheatBtn').style.display = 'block'; $('ambResetBtn').style.display = 'block';
}

function updateUI() { 
  const lvl = structure[levelIndex] || structure[structure.length-1]; 
  $('levelIndexDisplay').textContent = levelIndex + 1; 
  $('sb').textContent = lvl.sb; $('bb').textContent = lvl.bb; 
  $('timer').textContent = formatTime(timeLeft); 
  $('ambLevel').textContent = levelIndex + 1; 
  $('ambSb').textContent = lvl.sb; $('ambBb').textContent = lvl.bb; 
  $('ambTimer').textContent = formatTime(timeLeft); 
  const nextEl = $('nextLevel'); const ambNextEl = $('ambNextBlinds'); 
  let nextHtml = ''; 
  if (levelIndex + 1 < structure.length) { const next = structure[levelIndex+1]; nextHtml = `Далее: <span>${next.sb} / ${next.bb}</span>`; } 
  else { nextHtml = '🏆 <span>Финал</span>'; } 
  nextEl.innerHTML = nextHtml; ambNextEl.innerHTML = nextHtml; 
  const timerEl = $('timer'), ambTimerEl = $('ambTimer'); 
  const isWarn = timeLeft <= 60 && timeLeft > 10; const isDanger = timeLeft <= 10; 
  timerEl.classList.toggle('warning', isWarn); timerEl.classList.toggle('danger', isDanger); 
  ambTimerEl.classList.toggle('warning', isWarn); ambTimerEl.classList.toggle('danger', isDanger); 
  if (isRunning) $('status').textContent = '⏱ Игра идет...'; 
  else if (isPaused) $('status').textContent = '⏸ Пауза'; 
  else $('status').textContent = players.length ? '🟢 Готов к старту' : '➕ Добавьте игроков'; 
}

// Новая функция тика, основанная на целевом времени
function tick() {
  if (!syncIsCountingDown) return;
  
  const now = Date.now();
  const remaining = Math.ceil((syncTargetTime - now) / 1000);
  
  if (remaining > 0) {
    timeLeft = remaining;
    
    // Проверка предупреждений
    if (timeLeft === 60 && !warn60) { warn60 = true; playWarning(); }
    if (timeLeft === 30 && !warn30) { warn30 = true; playWarning(); }
    if (timeLeft === 3 && !warn3) { 
      warn3 = true; 
      playUrgentWarning(); 
      $('ambNextBlinds').classList.add('urgent'); 
      setTimeout(() => $('ambNextBlinds').classList.remove('urgent'), 3000); 
    }
    
    updateUI();
  } else {
    // Время вышло
    timeLeft = 0;
    updateUI();
    advanceLevel(true);
  }
}

function advanceLevel(isAuto = false) { 
  levelIndex++; warn60 = false; warn30 = false; warn3 = false; 
  $('ambNextBlinds').classList.remove('urgent');
  if (levelIndex >= structure.length) { 
    clearInterval(timerInterval); isRunning = false; syncIsCountingDown = false; releaseWakeLock(); 
    $('status').textContent = '🏆 Турнир окончен!'; 
    $('timer').classList.remove('warning','danger'); $('ambTimer').classList.remove('warning','danger'); 
    playLevelUpSound(); updateUI(); syncState(); return; 
  } 
  
  // Устанавливаем новое целевое время
  const durationSec = parseInt($('duration').value) * 60;
  syncTargetTime = Date.now() + (durationSec * 1000);
  timeLeft = durationSec;
  
  playLevelUpSound(); updateUI(); 
  const pos = getPositions(); dealChips(pos.sb, pos.bb); 
  
  if (!isAuto) { 
    syncIsCountingDown = false;
    isRunning = false; isPaused = true; releaseWakeLock(); 
    $('startBtn').disabled = false; $('pauseBtn').disabled = true; $('startBtn').textContent = 'Продолжить'; 
  } 
  syncState();
}

// === SYNC FUNCTIONS ===
function syncState() {
  if (!db) return;
  const state = {
    levelIndex,
    timeLeft, // Для отображения при паузе
    isRunning,
    isPaused,
    dealerIndex,
    players,
    syncTargetTime, // Ключевое поле для синхронизации
    timestamp: Date.now()
  };
  db.ref('pokerGame').set(state);
}

function listenForUpdates() {
  if (!db) return;
  db.ref('pokerGame').on('value', (snapshot) => {
    const data = snapshot.val();
    if (!data) return;
    
    // Обновляем локальные переменные
    levelIndex = data.levelIndex;
    dealerIndex = data.dealerIndex;
    players = data.players || [];
    isPaused = data.isPaused;
    
    // Логика синхронизации времени
    if (data.syncTargetTime) {
      syncTargetTime = data.syncTargetTime;
      isRunning = data.isRunning;
      syncIsCountingDown = data.isRunning;
      
      // Пересчитываем текущее оставшееся время на основе разницы с целевым
      const now = Date.now();
      timeLeft = Math.max(0, Math.ceil((syncTargetTime - now) / 1000));
      
      // Сбрасываем флаги предупреждений, если уровень сменился
      if (data.levelIndex !== levelIndex) {
         warn60 = false; warn30 = false; warn3 = false;
      }
    } else {
      // Если нет целевого времени (старая версия или пауза), используем простое время
      timeLeft = data.timeLeft;
      isRunning = data.isRunning;
      syncIsCountingDown = false;
    }
    
    renderPlayers();
    renderAmbientTable();
    updateUI();
    
    // Управление интервалом
    if (syncIsCountingDown && !timerInterval) {
      timerInterval = setInterval(tick, 200); // Обновляем чаще для плавности
      $('startBtn').disabled = true; $('pauseBtn').disabled = false; $('startBtn').textContent = 'Идет...';
    } else if (!syncIsCountingDown && timerInterval) {
      clearInterval(timerInterval); timerInterval = null;
      $('startBtn').disabled = false; $('pauseBtn').disabled = true;
      $('startBtn').textContent = isPaused ? 'Продолжить' : 'Старт';
    }
  });
}

$('startBtn').onclick = () => { 
  initAudio(); if(isRunning) return; 
  
  // Устанавливаем целевое время
  const durationSec = parseInt($('duration').value) * 60;
  syncTargetTime = Date.now() + (durationSec * 1000);
  timeLeft = durationSec;
  
  if(!isPaused) { levelIndex=0; warn60=false; warn30=false; warn3=false; generateStructure(); $('ambNextBlinds').classList.remove('urgent'); } 
  
  isRunning=true; isPaused=false; syncIsCountingDown = true;
  updateUI(); requestWakeLock(); 
  
  timerInterval=setInterval(tick, 200); 
  $('startBtn').disabled=true; $('pauseBtn').disabled=false; $('startBtn').textContent='Идет...'; 
  syncState();
};

$('pauseBtn').onclick = () => { 
  if(!isRunning) return; 
  clearInterval(timerInterval); timerInterval = null;
  isRunning=false; isPaused=true; syncIsCountingDown = false; releaseWakeLock(); 
  $('startBtn').disabled=false; $('pauseBtn').disabled=true; $('startBtn').textContent='Продолжить'; 
  updateUI(); syncState();
};

$('resetBtn').onclick = () => { 
  clearInterval(timerInterval); timerInterval = null;
  isRunning=false; isPaused=false; syncIsCountingDown = false; releaseWakeLock(); 
  levelIndex=0; timeLeft=parseInt($('duration').value)*60; warn60=false; warn30=false; warn3=false; generateStructure(); 
  $('ambNextBlinds').classList.remove('urgent'); 
  $('startBtn').disabled=false; $('pauseBtn').disabled=true; $('startBtn').textContent='Старт'; 
  updateUI(); syncState();
};

$('nextBtn').onclick = () => { initAudio(); advanceLevel(false); };

$('ambResetBtn').onclick = () => {
  clearInterval(timerInterval); timerInterval = null;
  isRunning=false; isPaused=false; syncIsCountingDown = false; releaseWakeLock();
  levelIndex=0; timeLeft=parseInt($('duration').value)*60; warn60=false; warn30=false; warn3=false; generateStructure();
  $('ambNextBlinds').classList.remove('urgent');
  updateUI(); syncState();
};

$('ambientBtn').onclick = () => { document.body.classList.toggle('ambient'); if(document.body.classList.contains('ambient')) { requestWakeLock(); renderAmbientTable(); } else { releaseWakeLock(); $('cheatOverlay').classList.remove('active'); if(gestureState.running) stopCamera(); $('ambCamBtn').classList.remove('active'); $('gestureOverlay').classList.remove('active'); $('gestureStatus').classList.remove('active'); $('ambDealerBtn').style.display = 'none'; $('ambCamBtn').style.display = 'none'; $('ambCheatBtn').style.display = 'none'; $('ambResetBtn').style.display = 'none'; } };
$('ambientHint').onclick = () => { document.body.classList.remove('ambient'); releaseWakeLock(); $('cheatOverlay').classList.remove('active'); if(gestureState.running) stopCamera(); $('ambCamBtn').classList.remove('active'); $('gestureOverlay').classList.remove('active'); $('gestureStatus').classList.remove('active'); $('ambDealerBtn').style.display = 'none'; $('ambCamBtn').style.display = 'none'; $('ambCheatBtn').style.display = 'none'; $('ambResetBtn').style.display = 'none'; };

window.addEventListener('resize', () => { if(document.body.classList.contains('ambient')) renderAmbientTable(); });

function saveSettings() { localStorage.setItem('pokerTimer_v17', JSON.stringify({ duration: $('duration').value, progression: $('progression').value, players: players, dealerIndex: dealerIndex })); }
function loadSettings() { const s = localStorage.getItem('pokerTimer_v17'); if(s) { const d = JSON.parse(s); $('duration').value = d.duration || 10; $('progression').value = d.progression || 'custom'; if(d.players) { players = d.players; dealerIndex = d.dealerIndex || 0; } } }
['duration','progression'].forEach(id => $(id).addEventListener('change', () => { saveSettings(); generateStructure(); updateUI(); syncState(); }));

loadSettings(); loadGestureSettings(); generateStructure(); renderPlayers(); updateUI();
if (db) listenForUpdates();
</script>
